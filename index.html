<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My Postcard</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	</head>
	<body class="bg-light">
		<div class="container mt-5">
			<div class="card shadow">
				<div class="card-header d-flex justify-content-between align-items-center">
					<h1 class="h5 mb-0">My Postcard</h1>
					<img
						src="https://raw.githubusercontent.com/breatheco-de/exercise-postcard/e63a7916530cc850bd92aa1c2e19191837fb5c80/.learn/assets/4geeks.png"
						alt="Logo de 4Geeks"
						style="width: 60px"
					/>
				</div>
				<div class="card-body row g-4">
					<div class="col-md-6">
						<p class="mb-0">
							Mira profe qué chulada! Esto es una postcard que he creado usando HTML, CSS, Bootstrap y JavaScript!<br />
							¡Es una pasada, quiero seguir haciendo más!
						</p>
					</div>
					<div class="col-md-6">
						<form id="postcardForm">
							<div class="mb-3">
								<input type="text" class="form-control" id="name" placeholder="Your Name" required />
							</div>
							<div class="mb-3">
								<input type="email" class="form-control" id="email" placeholder="Your Email" required />
							</div>
							<div class="mb-3">
								<textarea class="form-control" id="comment" rows="3" placeholder="Your Comment" required></textarea>
							</div>
							<button type="submit" class="btn btn-primary w-100">Send My Postcard</button>
						</form>
						<div id="confirmationMessage" class="alert alert-success mt-3 d-none">¡Gracias por enviar tu postal!</div>
					</div>
				</div>
			</div>
		</div>

		<script>
			document.getElementById("postcardForm").addEventListener("submit", function (e) {
				e.preventDefault();
				document.getElementById("confirmationMessage").classList.remove("d-none");
				this.reset();
			});
		</script>

	</body>
</html>
